<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a6b82" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="바람따라" />
    <title>바람따라</title>
    <script>
      (function () {
        try {
          var v = localStorage.getItem('windtrail:textScale');
          if (v === 'large' || v === 'xl') {
            document.documentElement.dataset.textScale = v;
          }
        } catch (e) {
          /* localStorage 접근 불가(프라이빗 모드 등) - 기본 크기로 진행 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
