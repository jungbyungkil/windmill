server:
  port: ${PORT:8080}

spring:
  application:
    name: windmill
  datasource:
    url: jdbc:h2:file:./data/windmill;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console

openai:
  api:
    key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}

# 한국관광공사 OpenAPI (data.go.kr) - 서비스별 base URL은 client 구현체에 고정, 여기는 인증키만
tourapi:
  key: ${TOURAPI_KEY:}
  kor-service-base-url: https://apis.data.go.kr/B551011/KorService2
  related-attraction-base-url: https://apis.data.go.kr/B551011/TarRlteTarService1
  crowd-rate-base-url: https://apis.data.go.kr/B551011/TatsCnctrRateService
  visitor-stats-base-url: https://apis.data.go.kr/B551011/DataLabService
  # 별도 활용신청 승인 필요 (2026-08-03 기준 미승인) - PetFriendlyAttractionClient 주석 참고
  pet-friendly-base-url: https://apis.data.go.kr/B551011/KorPetTourService2
  # 별도 활용신청 승인 필요 (2026-08-03 기준 미승인) - OdiiClient 주석 참고
  odii-base-url: https://apis.data.go.kr/B551011/Odii

# 기상청 단기예보 - 별도 키 없이 tourapi.key(data.go.kr 통합 서비스키)를 재사용
weather:
  api:
    base-url: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0

logging:
  level:
    com.windmill: INFO
