server:
  port: ${PORT:8080}

spring:
  application:
    name: windmill
  mvc:
    async:
      # 목적지 직접 선택 플로우(anchor-plan)가 4단계 파이프라인을 최대 4회 순차 호출한다 -
      # 호출당 15~20초대(data.go.kr 동시요청 취약으로 병렬화 대신 순차 유지, AnchorPlanService 주석 참고)라
      # 기본 타임아웃(컨테이너 기본 30초)에 걸리는 걸 실측으로 확인해 넉넉히 늘림
      request-timeout: 120000
  datasource:
    url: jdbc:h2:file:./data/windmill;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console

openai:
  api:
    key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}

# 한국관광공사 OpenAPI (data.go.kr) - 서비스별 base URL은 client 구현체에 고정, 여기는 인증키만
tourapi:
  key: ${TOURAPI_KEY:}
  kor-service-base-url: https://apis.data.go.kr/B551011/KorService2
  related-attraction-base-url: https://apis.data.go.kr/B551011/TarRlteTarService1
  crowd-rate-base-url: https://apis.data.go.kr/B551011/TatsCnctrRateService
  visitor-stats-base-url: https://apis.data.go.kr/B551011/DataLabService
  # 별도 활용신청 승인 필요 (2026-08-03 기준 미승인) - PetFriendlyAttractionClient 주석 참고
  pet-friendly-base-url: https://apis.data.go.kr/B551011/KorPetTourService2
  # 별도 활용신청 승인 필요 (2026-08-03 기준 미승인) - OdiiClient 주석 참고
  odii-base-url: https://apis.data.go.kr/B551011/Odii

# 카카오
kakao:
  # 길찾기 서버 프록시 REST 키
  rest-api-key: ${KAKAO_REST_API_KEY:}
  # 런타임 공개 JS 키(민감정보 아님). VITE 빌드키가 비었을 때 /api/public-config로 폴백
  js-key: ${KAKAO_JS_KEY:${VITE_KAKAO_JS_KEY:}}

# 기상청 단기예보 - 별도 키 없이 tourapi.key(data.go.kr 통합 서비스키)를 재사용
weather:
  api:
    base-url: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
  mid:
    base-url: https://apis.data.go.kr/1360000/MidFcstInfoService

logging:
  level:
    com.windmill: INFO

# 에러 리포팅(sentry.io). DSN 비어있으면 SDK가 자동으로 비활성화(no-op)됨 - 로컬 개발엔 기본 불필요.
# sentry-logback은 별도 추가하지 않음(컨트롤러 예외 캡처와 중복 리포팅 우려, 브리프 권장사항).
sentry:
  dsn: ${SENTRY_DSN:}
  environment: development
  traces-sample-rate: 1.0
  send-default-pii: false

# 웹 푸시(FCM) - Firebase 콘솔 > 프로젝트 설정 > 서비스 계정 > 새 비공개 키 생성(JSON) 후
# base64 인코딩해서 이 값으로. 비어있으면 PushSenderService가 자동으로 비활성화된다.
firebase:
  service-account-json-base64: ${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:}
